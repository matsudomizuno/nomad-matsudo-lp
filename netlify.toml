[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SNS計測用の短縮パス。bioには /x /ig と書けば済むので、
# プロフィール上の表示を汚さずにUTMを付けられる。
[[redirects]]
  from = "/x"
  to = "/?utm_source=x&utm_medium=social&utm_campaign=bio"
  status = 302
  force = true

[[redirects]]
  from = "/ig"
  to = "/?utm_source=instagram&utm_medium=social&utm_campaign=bio"
  status = 302
  force = true
